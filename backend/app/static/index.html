<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Марко</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232B4A9E'/><text x='16' y='22' font-family='Georgia' font-size='18' fill='white' text-anchor='middle'>М</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F3F0;          /* stone */
      --panel: #E8EAE5;       /* sidebar */
      --surface: #FFFFFF;     /* composer, cards */
      --ink: #1D2433;         /* text */
      --muted: #687082;
      --line: #D9DCD5;
      --accent: #2B4A9E;      /* lapis */
      --accent-ink: #FFFFFF;
      --accent-soft: #E1E7F4;
      --rec: #C2412D;
      --ok: #2F7A4F;
      --warn-bg: #FBF3DF;
      --warn-line: #E6CF8F;
      --serif: "Literata", Georgia, serif;
      --sans: "Golos Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181E; --panel: #1B1F27; --surface: #222733; --ink: #E6E8EE; --muted: #959CAB;
        --line: #2E3442; --accent: #8EA8EE; --accent-ink: #10162A; --accent-soft: #263152;
        --rec: #EE7B66; --ok: #6CC495; --warn-bg: #2C2717; --warn-line: #5E5024;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ============ Login ============ */
    .login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 500 17px/1 var(--serif); flex-shrink: 0; }
    .login h1 { font: 400 34px/1.2 var(--serif); margin: 28px 0 6px; letter-spacing: -0.01em; }
    .login p.lead { color: var(--muted); margin: 0 0 28px; }
    .field { display: block; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
    .field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
    .row { display: flex; gap: 8px; }
    .btn { border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; font-weight: 500; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.ghost:hover { background: var(--panel); filter: none; }
    .grow { flex: 1; }
    .note { color: var(--muted); font-size: 14px; }
    .error { color: var(--rec); }

    /* ============ App shell ============ */
    .app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .side-top { padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px; }
    .side-top .brand { padding: 2px 6px; font: 500 19px/1 var(--serif); }
    .new-chat { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; font-weight: 500; font-size: 15px; }
    .new-chat:hover { border-color: var(--accent); }
    .history { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
    .history h2 { font: 500 12.5px/1 var(--sans); color: var(--muted); margin: 18px 8px 6px; }
    .conv { display: flex; align-items: center; border-radius: 8px; }
    .conv:hover, .conv.active { background: rgba(43, 74, 158, 0.09); }
    .conv button.open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 7px 8px; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv button.del { border: 0; background: none; padding: 6px; color: var(--muted); opacity: 0; border-radius: 6px; }
    .conv:hover button.del, .conv.active button.del, .conv button.del:focus-visible { opacity: 1; }
    .conv button.del:hover { color: var(--rec); }
    .history .empty-list { color: var(--muted); font-size: 14px; padding: 8px; }
    .side-bottom { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .google { display: flex; align-items: center; gap: 8px; }
    .google .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .google button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 14px; width: 100%; text-align: left; }
    .google button:hover { border-color: var(--accent); }
    .me { display: flex; align-items: center; gap: 10px; }
    .me .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .me .email { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .me button { border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 6px; }
    .me button:hover { color: var(--ink); }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    .topbar { display: none; }
    .scroll { flex: 1; overflow-y: auto; }
    .column { max-width: 740px; margin: 0 auto; padding: 32px 24px 24px; }

    /* ============ Empty state ============ */
    .hello { display: flex; flex-direction: column; justify-content: center; min-height: 100%; }
    .main.is-empty .scroll { display: flex; flex-direction: column; justify-content: flex-end; flex: 0.9; }
    .main.is-empty .dock { flex: 1.1; }
    .hello h1 { font: 400 clamp(30px, 4vw, 40px)/1.2 var(--serif); letter-spacing: -0.015em; margin: 0 0 8px; text-align: center; }
    .hello p { color: var(--muted); text-align: center; margin: 0; }
    .ideas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
    .ideas button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 14.5px; color: var(--ink); }
    .ideas button:hover { border-color: var(--accent); background: var(--surface); }

    /* ============ Messages ============ */
    .thread { display: flex; flex-direction: column; gap: 22px; }
    .user-msg { align-self: flex-end; max-width: 80%; background: var(--accent-soft); padding: 10px 16px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-wrap: break-word; }
    .bot { display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: start; }
    .bot .mark { margin-top: 1px; }
    .bot-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .bot-text { white-space: pre-wrap; word-wrap: break-word; font-size: 16.5px; line-height: 1.65; }
    .bot-text.fail { color: var(--rec); }
    .actions { display: flex; gap: 2px; margin-left: -6px; }
    .actions button { border: 0; background: none; color: var(--muted); padding: 5px 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
    .actions button:hover { color: var(--ink); background: var(--panel); }
    .actions .icon { width: 17px; height: 17px; }

    .tools { font-size: 14px; color: var(--muted); }
    .tools summary { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; list-style: none; padding: 4px 10px 4px 8px; border: 1px solid var(--line); border-radius: 999px; }
    .tools summary::-webkit-details-marker { display: none; }
    .tools summary:hover { color: var(--ink); }
    .tools .icon { width: 16px; height: 16px; }
    .tools .step { margin: 8px 0 0 4px; padding-left: 12px; border-left: 2px solid var(--line); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
    .tools .step.error { border-color: var(--rec); }
    .tools .step.pending { border-color: var(--warn-line); }

    .confirm { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 14px; padding: 14px 16px; }
    .confirm .what { font-weight: 500; margin-bottom: 8px; }
    .confirm .body { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; white-space: pre-wrap; margin-bottom: 12px; }
    .confirm .done { font-size: 14px; color: var(--muted); }

    .thinking { display: inline-flex; gap: 5px; padding: 10px 0; }
    .thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
    .thinking i:nth-child(2) { animation-delay: 0.15s; }
    .thinking i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ============ Composer ============ */
    .dock { padding: 0 24px 18px; }
    .composer { max-width: 740px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 12px 12px 10px 18px; box-shadow: 0 1px 2px rgba(29, 36, 51, 0.04), 0 8px 24px -12px rgba(29, 36, 51, 0.12); transition: border-color 0.2s; }
    .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; font-size: 16.5px; line-height: 1.5; max-height: 200px; padding: 4px 0; }
    .composer textarea::placeholder { color: var(--muted); }
    .composer-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .composer-row .hint { flex: 1; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .round { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; flex-shrink: 0; }
    .round:disabled { opacity: 0.4; cursor: default; }
    .mic { background: var(--accent); color: var(--accent-ink); width: 46px; height: 46px; }
    .mic .icon { width: 22px; height: 22px; }
    .send { background: var(--panel); color: var(--ink); }
    .send.ready { background: var(--ink); color: var(--bg); }

    /* recording: the composer becomes a live voice meter */
    .meter { display: none; align-items: center; gap: 14px; height: 54px; }
    .composer.recording .meter { display: flex; }
    .composer.recording textarea, .composer.recording .composer-row .hint, .composer.recording .send { display: none; }
    .composer.recording { border-color: var(--rec); }
    .composer.recording .composer-row { margin-top: 0; position: absolute; right: 12px; bottom: 14px; }
    .composer { position: relative; }
    .composer.recording .mic { background: var(--rec); color: #fff; }
    .bars { flex: 1; display: flex; align-items: center; gap: 3px; height: 40px; padding-right: 64px; overflow: hidden; }
    .bars span { flex: 1; max-width: 5px; min-height: 3px; border-radius: 3px; background: var(--rec); opacity: 0.85; transition: height 0.08s linear; }
    .rec-time { font-variant-numeric: tabular-nums; color: var(--rec); font-weight: 500; min-width: 38px; }
    .foot { max-width: 740px; margin: 8px auto 0; text-align: center; font-size: 12.5px; color: var(--muted); min-height: 18px; }

    /* ============ Mobile ============ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 284px; z-index: 20; transform: translateX(-100%); transition: transform 0.2s ease; }
      .app.nav-open .sidebar { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.3); }
      .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
      .topbar button { border: 0; background: none; padding: 6px; border-radius: 8px; }
      .topbar .brand { font: 500 17px/1 var(--serif); }
      .column { padding: 22px 16px 16px; }
      .dock { padding: 0 12px max(12px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- svg icons, drawn once -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path d="M20 12.2c0-.6-.1-1.2-.2-1.7H12v3.3h4.5a4 4 0 0 1-1.7 2.6M12 20a8 8 0 1 1 5.3-14"/></symbol>
  </svg>

  <!-- ===================== Login ===================== -->
  <section class="login" id="loginView" hidden>
    <div class="login-card">
      <div class="brand"><span class="mark">М</span><strong>Марко</strong></div>
      <h1>Монголоор ярьдаг хувийн туслах</h1>
      <p class="lead">Цаг товлох, хуваарь шалгах, имэйл бичих ажлыг дуугаар хийнэ.</p>
      <form id="loginForm">
        <label class="field">Имэйл<input type="email" id="email" required autocomplete="email"></label>
        <label class="field">Нууц үг<input type="password" id="password" required minlength="6" autocomplete="current-password"></label>
        <div class="row">
          <button class="btn grow" type="submit">Нэвтрэх</button>
          <button class="btn ghost grow" type="button" id="signUp">Бүртгүүлэх</button>
        </div>
      </form>
      <p class="note" id="loginStatus" role="status" style="margin-top: 16px"></p>
    </div>
  </section>

  <!-- ===================== App ===================== -->
  <div class="app" id="appView" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand"><span class="mark">М</span>Марко</div>
        <button class="new-chat" id="newChat"><svg class="icon"><use href="#i-plus"/></svg>Шинэ яриа</button>
      </div>
      <nav class="history" id="history" aria-label="Ярианы түүх"></nav>
      <div class="side-bottom">
        <div class="google" id="googleBox"></div>
        <div class="me">
          <span class="avatar" id="avatar"></span>
          <span class="email" id="who"></span>
          <button id="signOut" title="Гарах" aria-label="Гарах"><svg class="icon"><use href="#i-out"/></svg></button>
        </div>
      </div>
    </aside>

    <main class="main is-empty" id="main">
      <div class="topbar">
        <button id="openNav" aria-label="Цэс"><svg class="icon"><use href="#i-menu"/></svg></button>
        <span class="brand">Марко</span>
      </div>

      <div class="scroll" id="scroll">
        <div class="column">
          <div class="hello" id="hello">
            <h1 id="greeting">Сайн байна уу</h1>
            <p>Микрофон дээр дараад ярина уу, эсвэл доор бичнэ үү.</p>
            <div class="ideas" id="ideas">
              <button>Маргааш юу байгаа вэ?</button>
              <button>Баасан гарагт 3 цагт хурал товлооч</button>
              <button>Болдын имэйл хаяг юу вэ?</button>
            </div>
          </div>
          <div class="thread" id="thread"></div>
        </div>
      </div>

      <div class="dock">
        <form class="composer" id="composer">
          <textarea id="textInput" rows="1" placeholder="Маркод юу хийлгэх вэ?" maxlength="1000" aria-label="Мессеж"></textarea>
          <div class="meter" aria-live="polite">
            <span class="rec-time" id="recTime">0:00</span>
            <div class="bars" id="bars"></div>
          </div>
          <div class="composer-row">
            <span class="hint" id="hint">Space — ярих, Enter — илгээх</span>
            <button type="submit" class="round send" id="send" aria-label="Илгээх" disabled><svg class="icon"><use href="#i-up"/></svg></button>
            <button type="button" class="round mic" id="mic" aria-label="Ярих"><svg class="icon"><use href="#i-mic"/></svg></button>
          </div>
        </form>
        <div class="foot" id="status" role="status"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // =============================================================== Setup
    const $ = (id) => document.getElementById(id);
    const MAX_SECONDS = 15;
    const TOOL_NAMES = {
      create_calendar_event: "Календарьт нэмсэн",
      list_calendar_events: "Календарь шалгасан",
      search_contacts: "Харилцагч хайсан",
      draft_email: "Ноорог хадгалсан",
      send_email: "Имэйл бэлдсэн",
    };

    let sb = null;
    let session = null;
    let conversationId = null;
    let busy = false;
    let player = null;

    async function start() {
      const config = await (await fetch("/api/config")).json();
      if (!config.supabase_anon_key) {
        document.body.innerHTML = '<p style="padding:40px">backend/.env файлд SUPABASE_ANON_KEY нэмнэ үү.</p>';
        return;
      }
      sb = supabase.createClient(config.supabase_url, config.supabase_anon_key);
      session = (await sb.auth.getSession()).data.session;
      sb.auth.onAuthStateChange((event, newSession) => {
        const changedUser = (newSession && newSession.user.id) !== (session && session.user.id);
        session = newSession;
        if (changedUser) render();
      });
      render();
    }

    function render() {
      $("loginView").hidden = !!session;
      $("appView").hidden = !session;
      if (!session) return;
      const email = session.user.email || "";
      $("who").textContent = email;
      $("avatar").textContent = email.slice(0, 1).toUpperCase();
      setGreeting();
      newChat();
      loadHistory();
      checkGoogle();
      showGoogleResult();
    }

    function setGreeting() {
      const hour = new Date().getHours();
      const part = hour < 11 ? "Өглөөний мэнд" : hour < 18 ? "Өдрийн мэнд" : "Оройн мэнд";
      $("greeting").textContent = part;
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}), Authorization: "Bearer " + session.access_token };
      if (options.json) {
        headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(options.json);
      }
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        await sb.auth.signOut();
        throw new Error("Нэвтрэлт дууссан. Дахин нэвтэрнэ үү.");
      }
      if (!response.ok) throw new Error(data.detail || "Серверийн алдаа " + response.status);
      return data;
    }

    function icon(name) {
      return '<svg class="icon"><use href="#i-' + name + '"/></svg>';
    }

    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    // =============================================================== Login
    function setLogin(text, isError = false) {
      $("loginStatus").textContent = text;
      $("loginStatus").classList.toggle("error", isError);
    }

    $("loginForm").onsubmit = async (event) => {
      event.preventDefault();
      setLogin("Нэвтэрч байна...");
      const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
      setLogin(error ? loginError(error.message) : "", !!error);
    };

    $("signUp").onclick = async () => {
      if (!$("loginForm").reportValidity()) return;
      setLogin("Бүртгэж байна...");
      const { data, error } = await sb.auth.signUp({ email: $("email").value, password: $("password").value });
      if (error) return setLogin(loginError(error.message), true);
      if (!data.session) setLogin("Бүртгэгдлээ. Имэйл дээр ирсэн линкээр баталгаажуулаад нэвтэрнэ үү.");
    };

    function loginError(message) {
      if (/invalid login/i.test(message)) return "Имэйл эсвэл нууц үг буруу байна.";
      if (/not confirmed/i.test(message)) return "Имэйлээ баталгаажуулаагүй байна. Ирсэн линкийг дарна уу.";
      if (/already registered/i.test(message)) return "Энэ имэйлээр бүртгэл байна. Нэвтэрнэ үү.";
      return message;
    }

    $("signOut").onclick = () => sb.auth.signOut();

    // =============================================================== Google
    async function checkGoogle() {
      const box = $("googleBox");
      try {
        const { connected } = await api("/api/google/status");
        if (connected) {
          box.innerHTML = '<span class="dot"></span><span>Google холбогдсон</span>';
        } else {
          box.innerHTML = '<button id="googleConnect">Google бүртгэл холбох</button>';
          $("googleConnect").onclick = connectGoogle;
        }
      } catch (error) {
        box.innerHTML = '<span class="note">Google: ' + "шалгаж чадсангүй" + "</span>";
      }
    }

    async function connectGoogle() {
      try {
        location.href = (await api("/api/google/connect")).url;
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function showGoogleResult() {
      const result = new URLSearchParams(location.search).get("google");
      if (!result) return;
      const text = {
        connected: "Google холбогдлоо. Одоо календарь, имэйлтэй ажиллаж болно.",
        cancelled: "Google холболтыг цуцаллаа.",
        error: "Google холбогдсонгүй. Дахин оролдоно уу.",
      }[result];
      setStatus(text || "", result !== "connected");
      history.replaceState(null, "", "/");
    }

    // =============================================================== History (sidebar)
    async function loadHistory() {
      let items = [];
      try {
        items = await api("/api/conversations");
      } catch (error) {
        $("history").innerHTML = '<p class="empty-list">Түүхийг ачаалж чадсангүй.</p>';
        return;
      }
      const nav = $("history");
      nav.innerHTML = "";
      if (!items.length) {
        nav.innerHTML = '<p class="empty-list">Ярианууд энд хадгалагдана.</p>';
        return;
      }
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      let group = "";
      for (const item of items) {
        const day = new Date(item.updated_at).toDateString();
        const label = day === today ? "Өнөөдөр" : day === yesterday ? "Өчигдөр" : "Өмнөх";
        if (label !== group) {
          group = label;
          const h = document.createElement("h2");
          h.textContent = label;
          nav.append(h);
        }
        const row = document.createElement("div");
        row.className = "conv" + (item.id === conversationId ? " active" : "");
        row.dataset.id = item.id;
        const open = document.createElement("button");
        open.className = "open";
        open.textContent = item.title;
        open.title = item.title;
        open.onclick = () => openConversation(item.id);
        const del = document.createElement("button");
        del.className = "del";
        del.innerHTML = icon("trash");
        del.setAttribute("aria-label", "Устгах: " + item.title);
        del.onclick = () => deleteConversation(item.id, item.title);
        row.append(open, del);
        nav.append(row);
      }
    }

    function markActive() {
      document.querySelectorAll(".conv").forEach((row) => row.classList.toggle("active", Number(row.dataset.id) === conversationId));
    }

    async function openConversation(id) {
      closeNav();
      try {
        const data = await api("/api/conversations/" + id);
        conversationId = id;
        $("thread").innerHTML = "";
        setEmpty(false);
        for (const m of data.messages) {
          if (m.sender === "user") addUser(m.text);
          else addBot().setText(m.text);
        }
        markActive();
        scrollDown(false);
        setStatus("");
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function deleteConversation(id, title) {
      if (!confirm("«" + title + "» яриаг устгах уу? Буцаах боломжгүй.")) return;
      try {
        await api("/api/conversations/" + id, { method: "DELETE" });
        if (id === conversationId) newChat();
        loadHistory();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function newChat() {
      conversationId = null;
      $("thread").innerHTML = "";
      setEmpty(true);
      markActive();
      closeNav();
      $("textInput").focus();
    }
    $("newChat").onclick = newChat;

    function setEmpty(on) {
      $("main").classList.toggle("is-empty", on);
      $("hello").hidden = !on;
    }

    // mobile navigation
    $("openNav").onclick = () => $("appView").classList.add("nav-open");
    function closeNav() { $("appView").classList.remove("nav-open"); }
    $("appView").addEventListener("click", (event) => {
      if ($("appView").classList.contains("nav-open") && !$("sidebar").contains(event.target) && !$("openNav").contains(event.target)) closeNav();
    });

    // =============================================================== Thread
    function scrollDown(smooth = true) {
      const box = $("scroll");
      box.scrollTo({ top: box.scrollHeight, behavior: smooth ? "smooth" : "auto" });
    }

    function addUser(text) {
      setEmpty(false);
      const div = document.createElement("div");
      div.className = "user-msg";
      div.textContent = text;
      $("thread").append(div);
      scrollDown();
    }

    // Marco's turn. Starts as "thinking" dots, then fills in.
    function addBot() {
      setEmpty(false);
      const row = document.createElement("div");
      row.className = "bot";
      row.innerHTML = '<span class="mark" aria-hidden="true">М</span><div class="bot-body"><div class="thinking" aria-label="Марко бодож байна"><i></i><i></i><i></i></div></div>';
      $("thread").append(row);
      scrollDown();
      const body = row.querySelector(".bot-body");

      return {
        row,
        setText(text, audio, isError = false) {
          body.innerHTML = "";
          const p = document.createElement("div");
          p.className = "bot-text" + (isError ? " fail" : "");
          p.textContent = text;
          body.append(p);
          if (!isError) body.append(actions(text, audio));
          scrollDown();
        },
        addTools(steps) {
          if (!steps || !steps.length) return;
          const box = document.createElement("details");
          box.className = "tools";
          const names = [...new Set(steps.map((s) => TOOL_NAMES[s.tool] || s.tool))];
          box.innerHTML = "<summary>" + icon("tool") + "<span></span></summary>";
          box.querySelector("summary span").textContent = names.join(", ");
          for (const step of steps) {
            const line = document.createElement("div");
            line.className = "step " + step.status;
            line.textContent = step.tool + "(" + JSON.stringify(step.args) + ")\n→ " + step.result;
            box.append(line);
          }
          body.prepend(box);
        },
        addConfirm(action) {
          body.append(confirmCard(action));
          scrollDown();
        },
      };
    }

    function actions(text, audio) {
      const bar = document.createElement("div");
      bar.className = "actions";
      if (audio) {
        const listen = document.createElement("button");
        listen.innerHTML = icon("play") + "Сонсох";
        listen.onclick = () => play(audio);
        bar.append(listen);
      }
      const copy = document.createElement("button");
      copy.innerHTML = icon("copy") + "<span>Хуулах</span>";
      copy.onclick = async () => {
        await navigator.clipboard.writeText(text);
        copy.querySelector("span").textContent = "Хууллаа";
        setTimeout(() => (copy.querySelector("span").textContent = "Хуулах"), 1500);
      };
      bar.append(copy);
      return bar;
    }

    function confirmCard(action) {
      const card = document.createElement("div");
      card.className = "confirm";
      const what = document.createElement("div");
      what.className = "what";
      what.textContent = action.summary;
      card.append(what);
      if (action.args && action.args.body) {
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = action.args.body;
        card.append(body);
      }
      const row = document.createElement("div");
      row.className = "row";
      const yes = document.createElement("button");
      yes.className = "btn";
      yes.textContent = "Илгээх";
      const no = document.createElement("button");
      no.className = "btn ghost";
      no.textContent = "Цуцлах";
      yes.onclick = () => decide(card, row, action.id, true);
      no.onclick = () => decide(card, row, action.id, false);
      row.append(yes, no);
      card.append(row);
      return card;
    }

    async function decide(card, row, actionId, approve) {
      row.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const bot = addBot();
      try {
        const data = await api("/api/confirm", { method: "POST", json: { action_id: actionId, approve, conversation_id: conversationId } });
        row.outerHTML = '<div class="done">' + (approve ? "Илгээхийг зөвшөөрсөн" : "Цуцалсан") + "</div>";
        bot.setText(data.reply_text, data.audio_base64);
        play(data.audio_base64);
      } catch (error) {
        row.querySelectorAll("button").forEach((b) => (b.disabled = false));
        bot.setText(error.message, null, true);
      }
    }

    function play(audioBase64) {
      if (!audioBase64) return;
      if (player) player.pause();
      player = new Audio("data:audio/mpeg;base64," + audioBase64);
      player.play().catch(() => {});
    }

    function showAnswer(bot, data, typedText) {
      const isNew = conversationId !== data.conversation_id;
      conversationId = data.conversation_id;
      if (!typedText) {
        // voice: show what Marco heard, before the answer
        const userDiv = document.createElement("div");
        userDiv.className = "user-msg";
        userDiv.textContent = data.user_text || "(юу ч сонсогдсонгүй)";
        $("thread").insertBefore(userDiv, bot.row);
      }
      bot.setText(data.reply_text, data.audio_base64);
      bot.addTools(data.steps);
      if (data.pending_action) bot.addConfirm(data.pending_action);
      play(data.audio_base64);
      if (isNew) loadHistory().then(markActive);
    }

    function setBusy(on) {
      busy = on;
      $("mic").disabled = on;
      updateSend();
    }

    // =============================================================== Typing
    const input = $("textInput");

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    }
    function updateSend() {
      const ready = input.value.trim().length > 0 && !busy;
      $("send").disabled = !ready;
      $("send").classList.toggle("ready", ready);
    }
    input.addEventListener("input", () => { autosize(); updateSend(); });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        $("composer").requestSubmit();
      }
    });

    $("composer").onsubmit = (event) => {
      event.preventDefault();
      sendText(input.value.trim());
    };

    $("ideas").onclick = (event) => {
      if (event.target.tagName === "BUTTON") sendText(event.target.textContent);
    };

    async function sendText(text) {
      if (!text || busy) return;
      input.value = "";
      autosize();
      setBusy(true);
      setStatus("");
      addUser(text);
      const bot = addBot();
      try {
        showAnswer(bot, await api("/api/chat", { method: "POST", json: { text, conversation_id: conversationId } }), text);
      } catch (error) {
        bot.setText(error.message, null, true);
      }
      setBusy(false);
      input.focus();
    }

    // =============================================================== Voice
    let recorder = null;
    let chunks = [];
    let ticker = null;
    let stopTimer = null;
    let audioCtx = null;
    let frame = null;
    const BAR_COUNT = 48;
    for (let i = 0; i < BAR_COUNT; i++) $("bars").append(document.createElement("span"));

    function pickMimeType() {
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
    }

    // Live level meter: newest loudness enters on the right
    function startMeter(stream) {
      const bars = [...$("bars").children];
      const levels = new Array(BAR_COUNT).fill(0);
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      const data = new Uint8Array(analyser.fftSize);
      let last = 0;
      const draw = (time) => {
        frame = requestAnimationFrame(draw);
        if (time - last < 60) return;
        last = time;
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (const v of data) sum += (v - 128) * (v - 128);
        const rms = Math.sqrt(sum / data.length) / 128;
        levels.push(Math.min(1, rms * 4));
        levels.shift();
        bars.forEach((bar, i) => (bar.style.height = Math.max(3, levels[i] * 40) + "px"));
      };
      frame = requestAnimationFrame(draw);
    }

    function stopMeter() {
      cancelAnimationFrame(frame);
      if (audioCtx) audioCtx.close();
      audioCtx = null;
      [...$("bars").children].forEach((bar) => (bar.style.height = "3px"));
    }

    async function toggleRecording() {
      if (busy) return;
      if (recorder && recorder.state === "recording") {
        stopRecording();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      } catch (error) {
        setStatus("Микрофон ашиглах зөвшөөрөл өгнө үү (хөтчийн хаягийн мөрний хажууд).", true);
        return;
      }
      if (player) player.pause();
      setStatus("");
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: pickMimeType() });
      recorder.ondataavailable = (event) => event.data.size && chunks.push(event.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((track) => track.stop());
        stopMeter();
        await sendRecording(new Blob(chunks, { type: recorder.mimeType }));
      };
      recorder.start();
      startMeter(stream);

      $("composer").classList.add("recording");
      $("mic").innerHTML = icon("stop");
      $("mic").setAttribute("aria-label", "Зогсоох");
      const began = Date.now();
      $("recTime").textContent = "0:00";
      ticker = setInterval(() => {
        const s = Math.floor((Date.now() - began) / 1000);
        $("recTime").textContent = "0:" + String(s).padStart(2, "0");
      }, 250);
      stopTimer = setTimeout(stopRecording, MAX_SECONDS * 1000);
    }

    function stopRecording() {
      clearTimeout(stopTimer);
      clearInterval(ticker);
      $("composer").classList.remove("recording");
      $("mic").innerHTML = icon("mic");
      $("mic").setAttribute("aria-label", "Ярих");
      if (recorder && recorder.state === "recording") recorder.stop();
    }

    async function sendRecording(blob) {
      if (blob.size < 2000) {
        setStatus("Бичлэг хэт богино байлаа. Дахин дараад ярина уу.");
        return;
      }
      setBusy(true);
      const bot = addBot();
      const form = new FormData();
      form.append("audio", blob, blob.type.includes("mp4") ? "voice.mp4" : "voice.webm");
      if (conversationId) form.append("conversation_id", conversationId);
      try {
        showAnswer(bot, await api("/api/voice", { method: "POST", body: form }));
      } catch (error) {
        bot.setText(error.message, null, true);
      }
      setBusy(false);
    }

    $("mic").onclick = toggleRecording;
    document.addEventListener("keydown", (event) => {
      const typing = ["INPUT", "TEXTAREA"].includes(event.target.tagName) && !(event.target === input && input.value === "");
      if (event.code === "Space" && !event.repeat && !typing && session && !$("appView").hidden) {
        event.preventDefault();
        toggleRecording();
      }
    });

    start();
  </script>
</body>
</html>
